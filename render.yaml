services:
  - type: worker
    name: daily-crypto-news-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    restartPolicy:
      type: on_failure
      maxRetries: 3
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LUNARCRUSH_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: TRACKED_COINS
        value: BTC,ETH,SOL,BNB
